services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gimnasio
      POSTGRES_USER: gimnasio
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gimnasio -d gimnasio"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
